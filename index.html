<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Ecosystem | Main Node</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #05050a;
            --accent: #ff8c00;
            --accent-glow: rgba(255, 140, 0, 0.4);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #e6edf3;
            --text-dim: #a0a0c0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', sans-serif; 
            overflow-x: hidden; 
            min-height: 100vh;
        }

        #canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* HEADER */
        .header-ui {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;
            backdrop-filter: blur(20px); padding: 15px 25px; border-radius: 20px;
            border: 1px solid var(--glass-border); background: var(--glass);
            position: relative; z-index: 2000;
        }

        .logo-box { display: flex; align-items: center; gap: 12px; font-weight: 800; color: var(--accent); letter-spacing: 3px; }

        .nav-actions { display: flex; gap: 12px; align-items: center; }

        /* КОЛОКОЛЬЧИК И НОВОСТИ */
        .notification-container { position: relative; }
        .notification-bell {
            background: none; border: none; color: var(--text-dim);
            font-size: 1.3rem; cursor: pointer; padding: 8px; transition: 0.3s;
        }
        .bell-dot {
            position: absolute; top: 8px; right: 8px; width: 8px; height: 8px;
            background: #ff4444; border-radius: 50%; display: none;
            box-shadow: 0 0 10px #ff4444;
        }

        .news-dropdown {
            position: absolute; top: 55px; right: 0; width: 320px;
            background: #0a0b14; border: 1px solid var(--accent);
            border-radius: 20px; display: none; flex-direction: column;
            z-index: 9999; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .news-dropdown.show { display: flex; animation: slideDown 0.3s ease; }
        .news-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .news-date { font-size: 0.7rem; color: var(--accent); font-weight: bold; margin-bottom: 4px; display: block; }
        .news-text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.4; }

        /* СЕТКА СЕРВИСОВ */
        .services-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; margin-bottom: 40px; position: relative; z-index: 1;
        }
        .node-card {
            background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 25px; text-decoration: none; color: inherit;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .node-card:hover { border-color: var(--accent); transform: translateY(-8px); background: rgba(255,255,255,0.05); }
        .node-icon { font-size: 2rem; color: var(--accent); margin-bottom: 15px; }
        .node-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
        .node-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.5; }

        /* НИЖНИЙ ВИДЖЕТ */
        .news-widget {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 25px; margin-bottom: 60px;
        }
        .news-widget-header { color: var(--accent); font-weight: bold; margin-bottom: 15px; font-size: 0.9rem; }
        .news-widget-item { display: flex; gap: 15px; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); margin-bottom: 10px; }
        .news-widget-date { min-width: 110px; font-size: 0.75rem; color: var(--accent); font-family: monospace; }

        /* МИКРОФОН */
        .mic-btn {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: var(--accent); border-radius: 50%; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            z-index: 5000; box-shadow: 0 10px 25px var(--accent-glow); transition: 0.3s;
        }
        .mic-btn:active { transform: scale(0.9); }

        /* ПОИСК И КНОПКИ */
        .btn-donate { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .search-trigger { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 10px 15px; border-radius: 12px; color: var(--text-dim); cursor: pointer; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* МОБИЛЬНАЯ АДАПТАЦИЯ (ЦЕНТРОВКА) */
        @media (max-width: 600px) {
            .news-dropdown {
                position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) !important;
                width: 90%; max-width: 350px;
            }
            .news-dropdown.show { display: flex; animation: fadeIn 0.3s ease; }
            .header-ui { padding: 10px 15px; }
            .logo-text { font-size: 1.2rem; }
            .news-widget-item { flex-direction: column; gap: 5px; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="container">
    <header class="header-ui">
        <div class="logo-box">
            <i class="fas fa-brain"></i><span class="logo-text">NEURON</span>
        </div>
        <div class="nav-actions">
            <div class="search-trigger" onclick="toggleSearch()"><i class="fas fa-search"></i></div>
            <div class="notification-container">
                <button class="notification-bell" onclick="toggleNewsDropdown()">
                    <i class="fas fa-bell"></i>
                    <span class="bell-dot" id="bell-dot"></span>
                </button>
                <div class="news-dropdown" id="news-dropdown">
                    <div id="news-list"></div>
                    <div style="padding:10px; text-align:center; font-size:0.7rem; opacity:0.5;">Нажмите вне окна, чтобы закрыть</div>
                </div>
            </div>
            <button class="btn-donate" onclick="toggleDonate()">$$$</button>
        </div>
    </header>

    <div class="services-grid" id="main-grid"></div>

    <section class="news-section">
        <div class="news-widget">
            <div class="news-widget-header"><i class="fas fa-history"></i> ЖУРНАЛ ОБНОВЛЕНИЙ</div>
            <div id="news-widget-list"></div>
        </div>
    </section>
</div>

<div id="search-modal" onclick="toggleSearch()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:10000; justify-content:center; padding-top:15vh;">
    <div class="search-container" onclick="event.stopPropagation()" style="width:90%; max-width:500px">
        <input type="text" id="search-input" placeholder="Поиск по системе..." style="width:100%; background:none; border:2px solid var(--accent); color:#fff; padding:15px; border-radius:15px; outline:none; font-size:1.2rem;">
        <div id="suggestions" style="margin-top:20px;"></div>
    </div>
</div>

<div class="mic-btn" id="mic-btn" onclick="toggleVoice()">
    <i class="fas fa-microphone" style="color:#000; font-size:1.4rem"></i>
</div>

<script>
    const services = [
        { name: "Neuron Status", url: "https://status.neuron-p2p.ru", icon: "fa-signal", desc: "Живой мониторинг аптайма всех систем экосистемы.", tags: ["статус", "онлайн", "status", "работа", "мониторинг", "раб"] }, 
        { name: "Neuron AI", url: "https://neuron-ai-eta.vercel.app/", icon: "fa-robot", desc: "Нейросетевой хаб для генерации и анализа данных.", tags: ["ии", "ai", "нейросеть", "нейронка", "гпт", "нейро", "иишка", "генерация"] }, 
        { name: "Neuron Notes", url: "notes.html", icon: "fa-sticky-note", desc: "Безопасное хранилище ваших идей и черновиков.", tags: ["заметки", "блокнот", "текст", "запиши", "напиши", "заметочка", "заметка", "метка", "меточка"] }, 
        { name: "Neuron Converter", url: "https://converter.neuron-p2p.ru", icon: "fa-exchange-alt", desc: "Быстрая конвертация любых величин и валют.", tags: ["конвертер", "валюта", "деньги", "перевод"] }, 
        { name: "Digital Studio", url: "studio.html", icon: "fa-palette", desc: "Создание интерфейсов и цифрового искусства.", tags: ["студия", "дизайн", "studio", "сайт", "домен"] }, 
        { name: "Neuron Tools", url: "https://tools.neuron-p2p.ru", icon: "fa-tools", desc: "Инструментарий для разработчиков и инженеров.", tags: ["тулс", "инструменты", "tools", "инструмент"] }, 
        { name: "Neuron Budget", url: "https://budget.neuron-p2p.ru", icon: "fa-wallet", desc: "Учет личных финансов в защищенном контуре.", tags: ["бюджет", "деньги", "кошелек", "траты", "операции", "операция", "аналитика"] }, 
        { name: "Neuron Study", url: "https://study.neuron-p2p.ru", icon: "fa-graduation-cap", desc: "Платформа для обучения и хранения знаний.", tags: ["учеба", "школа", "лекции", "учится", "дз", "домашнее задание", "school"] }, 
        { name: "Neuron Link", url: "https://link.neuron-p2p.ru", icon: "fa-shield-alt", desc: "Сервис для анонимизации и защиты внешних ссылок.", tags: ["линк", "ссылка", "безопасность", "тег"] }, 
        { name: "Neuron Calendar", url: "https://calendar.neuron-p2p.ru", icon: "fa-calendar-alt", desc: "Планировщик задач с синхронизацией узлов.", tags: ["календарь", "время", "планы", "план", "планировщик", "событие"] }, 
        { name: "Game Hub", url: "https://game-hub.neuron-p2p.ru", icon: "fa-gamepad", desc: "Игровой сегмент для отдыха внутри системы.", tags: ["игры", "гейм", "отдых", "игра", "пазл", "пазлы", "печать", "2048"] }, 
        { name: "Pass Generator", url: "https://password-generator.neuron-p2p.ru", icon: "fa-key", desc: "Создание паролей с максимальной энтропией.", tags: ["пароль", "безопасность", "ключ", "пароли", "пас", "пасс", "pass", "password"] }, 
        { name: "Neuron Synapse", url: "https://synapse.neuron-p2p.ru", icon: "fa-network-wired", desc: "Шифрованный протокол связи между пользователями.", tags: ["чат", "связь", "синапс", "аноним", "разговор", "писать"] }, 
        { name: "What If", url: "https://ifwhat.ru", icon: "fa-infinity", desc: "Анализ альтернативных сценариев и гипотез.", tags: ["что если", "история", "сценарии", "вдруг", "гипотеза", "сценарий", "альтернатива"] },
        { name: "Донат", url: "https://yoomoney.ru/to/4100119394883694", icon: "fa-heart", desc: "Поддержать проект.", tags: ["донат", "деньги", "donate", "пожертвование", "помощь", "помочь", "help"] }
    ];

    const ALL_NEWS = [
        { id: 3, date: "20.01.2026 | 21:30", text: "Исправлен поиск и микрофон. На телефонах уведомления теперь открываются по центру." },
        { id: 2, date: "20.01.2026 | 21:00", text: "Добавлен нижний журнал событий." },
        { id: 1, date: "20.01.2026 | 12:00", text: "Запуск системы Neuron 2.0." }
    ];

    function init() {
        document.getElementById('main-grid').innerHTML = services.map(s => `
            <a href="${s.url}" class="node-card" target="_blank">
                <i class="fas ${s.icon} node-icon"></i>
                <h3 class="node-title">${s.name}</h3>
                <p class="node-desc">${s.desc}</p>
            </a>
        `).join('');

        const html = ALL_NEWS.slice(0, 3).map(n => `<div class="news-item"><span class="news-date">${n.date}</span><div class="news-text">${n.text}</div></div>`).join('');
        const widgetHtml = ALL_NEWS.slice(0, 3).map(n => `<div class="news-widget-item"><div class="news-widget-date">${n.date}</div><div class="news-widget-text">${n.text}</div></div>`).join('');
        
        document.getElementById('news-list').innerHTML = html;
        document.getElementById('news-widget-list').innerHTML = widgetHtml;

        const lastId = localStorage.getItem('last_news_id') || 0;
        if (ALL_NEWS[0].id > lastId) document.getElementById('bell-dot').style.display = 'block';
    }

    function toggleNewsDropdown() {
        const d = document.getElementById('news-dropdown');
        d.classList.toggle('show');
        if (d.classList.contains('show')) {
            document.getElementById('bell-dot').style.display = 'none';
            localStorage.setItem('last_news_id', ALL_NEWS[0].id);
        }
    }

    function toggleSearch() {
        const m = document.getElementById('search-modal');
        m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        if(m.style.display === 'flex') document.getElementById('search-input').focus();
    }

    // Закрытие новостей при клике мимо
    window.addEventListener('click', (e) => {
        if (!e.target.closest('.notification-container')) {
            document.getElementById('news-dropdown').classList.remove('show');
        }
    });

    // Голос
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'ru-RU';
    function toggleVoice() { try { recognition.start(); } catch(e) {} }
    recognition.onstart = () => document.getElementById('mic-btn').style.background = '#ff4444';
    recognition.onend = () => document.getElementById('mic-btn').style.background = 'var(--accent)';
    recognition.onresult = (e) => {
        const query = e.results[0][0].transcript.toLowerCase();
        const s = services.find(x => query.includes(x.name.toLowerCase()) || x.tags.some(t => query.includes(t)));
        if(s) window.open(s.url, '_blank');
    };

    // Фон
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();
    for(let i=0; i<50; i++) pts.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3});
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = 'rgba(255,140,0,0.2)';
        pts.forEach(p => {
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0||p.x>canvas.width) p.vx*=-1; if(p.y<0||p.y>canvas.height) p.vy*=-1;
            ctx.beginPath(); ctx.arc(p.x,p.y,1,0,Math.PI*2); ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    draw();
    init();

    function toggleDonate() { window.open('https://yoomoney.ru/to/4100119394883694', '_blank'); }
</script>
</body>
</html>
