<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Ecosystem | Main Node</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #05050a;
            --accent: #ff8c00;
            --accent-glow: rgba(255, 140, 0, 0.4);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #e6edf3;
            --text-dim: #a0a0c0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            overflow-x: hidden; 
            min-height: 100vh;
        }

        #canvas { position: fixed; top: 0; left: 0; z-index: -1; filter: blur(0.4px); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* HEADER */
        .header-ui {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;
            backdrop-filter: blur(20px); padding: 20px 30px; border-radius: 24px;
            border: 1px solid var(--glass-border); background: var(--glass);
            animation: slideDown 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative; z-index: 1000; /* Чтобы шапка была выше сетки */
        }

        .logo-box { display: flex; align-items: center; gap: 15px; }
        .logo-text { font-size: 1.5rem; font-weight: 800; letter-spacing: 5px; color: var(--accent); text-transform: uppercase; }

        .nav-actions { display: flex; gap: 15px; align-items: center; }

        /* КОЛОКОЛЬЧИК (ИСПРАВЛЕННЫЙ) */
        .notification-container { position: relative; }
        .notification-bell {
            background: none; border: none; color: var(--text-dim);
            font-size: 1.4rem; cursor: pointer; transition: 0.3s; padding: 5px;
        }
        .bell-dot {
            position: absolute; top: 5px; right: 5px; width: 10px; height: 10px;
            background: #ff4444; border-radius: 50%; border: 2px solid var(--bg); display: none;
        }

        .news-dropdown {
            position: absolute; top: 55px; right: 0; width: 300px;
            background: #0a0b14; border: 1px solid var(--accent);
            border-radius: 20px; backdrop-filter: blur(30px); display: none;
            flex-direction: column; z-index: 9999 !important; /* МАКСИМАЛЬНЫЙ приоритет */
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .news-dropdown.show { display: flex; animation: slideDown 0.3s ease; }
        .news-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .news-date { font-size: 0.7rem; color: var(--accent); font-weight: bold; display: block; margin-bottom: 5px; }
        .news-text { font-size: 0.85rem; line-height: 1.4; color: var(--text-dim); }

        /* СЕТКА СЕРВИСОВ */
        .services-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; margin-bottom: 40px; position: relative; z-index: 1; 
        }

        .node-card {
            background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--glass-border);
            border-radius: 28px; padding: 30px; text-decoration: none; color: inherit;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInUp 0.6s ease backwards;
        }
        .node-card:hover { border-color: var(--accent); transform: translateY(-10px); }
        .node-icon { font-size: 2.2rem; color: var(--accent); margin-bottom: 20px; }
        .node-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 10px; }
        .node-desc { font-size: 0.9rem; color: var(--text-dim); line-height: 1.5; }

        /* ВИДЖЕТ НОВОСТЕЙ ВНИЗУ */
        .news-section { margin-bottom: 60px; }
        .news-widget {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 28px; padding: 25px;
        }
        .news-widget-header { color: var(--accent); font-weight: bold; margin-bottom: 20px; letter-spacing: 1px; }
        .news-widget-item { 
            display: flex; gap: 20px; padding: 12px; 
            border-radius: 15px; background: rgba(255,255,255,0.02); margin-bottom: 10px;
        }
        .news-widget-date { min-width: 120px; font-size: 0.75rem; color: var(--accent); }

        /* КНОПКИ И МОДАЛКИ */
        .btn-donate { background: var(--accent); color: #000; border: none; padding: 12px 24px; border-radius: 14px; font-weight: 800; cursor: pointer; }
        .search-trigger { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); padding: 12px 24px; border-radius: 14px; color: var(--text-dim); cursor: pointer; }

        .footer { text-align: center; padding: 40px; opacity: 0.5; font-size: 0.8rem; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .header-ui { flex-direction: column; gap: 15px; }
            .news-widget-item { flex-direction: column; gap: 5px; }
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="container">
    <header class="header-ui">
        <div class="logo-box">
            <i class="fas fa-brain"></i>
            <span class="logo-text">Neuron</span>
        </div>
        <div class="nav-actions">
            <div class="search-trigger" onclick="toggleSearch()"><i class="fas fa-search"></i></div>
            
            <div class="notification-container">
                <button class="notification-bell" onclick="toggleNewsDropdown()">
                    <i class="fas fa-bell"></i>
                    <span class="bell-dot" id="bell-dot"></span>
                </button>
                <div class="news-dropdown" id="news-dropdown">
                    <div id="news-list"></div>
                </div>
            </div>

            <button class="btn-donate" onclick="toggleDonate()">Поддержать</button>
        </div>
    </header>

    <div class="services-grid" id="main-grid"></div>

    <section class="news-section">
        <div class="news-widget">
            <div class="news-widget-header"><i class="fas fa-bolt"></i> ПОСЛЕДНИЕ СОБЫТИЯ</div>
            <div id="news-widget-list"></div>
        </div>
    </section>

    <footer class="footer">
        <p>NEURON ECOSYSTEM © 2026</p>
    </footer>
</div>

<div class="modal-overlay" id="donate-modal" onclick="toggleDonate()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; justify-content:center; align-items:center; backdrop-filter:blur(10px);">
    <div class="modal-content" onclick="event.stopPropagation()" style="background:#0a0b14; border:1px solid var(--accent); padding:40px; border-radius:30px; text-align:center;">
        <h2 style="color:var(--accent)">Донат</h2>
        <button class="btn-donate" style="margin-top:20px" onclick="window.open('https://yoomoney.ru/to/4100119394883694')">Перейти к оплате</button>
    </div>
</div>

<div id="search-modal" onclick="toggleSearch()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(5,5,10,0.98); z-index:10000; justify-content:center; padding-top:10vh;">
    <div class="search-container" onclick="event.stopPropagation()" style="width:90%; max-width:600px">
        <input type="text" id="search-input" placeholder="Поиск..." style="width:100%; background:rgba(255,255,255,0.05); border:2px solid var(--accent); color:#fff; padding:20px; border-radius:20px; outline:none;">
        <div id="suggestions" style="margin-top:20px;"></div>
    </div>
</div>

<script>
    const services = [
        { name: "Neuron Status", url: "https://status.neuron-p2p.ru", icon: "fa-signal", desc: "Живой мониторинг аптайма всех систем экосистемы.", tags: ["статус", "онлайн", "status", "работа", "мониторинг", "раб"] }, 
        { name: "Neuron AI", url: "https://neuron-ai-eta.vercel.app/", icon: "fa-robot", desc: "Нейросетевой хаб для генерации и анализа данных.", tags: ["ии", "ai", "нейросеть", "нейронка", "гпт", "нейро", "иишка", "генерация"] }, 
        { name: "Neuron Notes", url: "notes.html", icon: "fa-sticky-note", desc: "Безопасное хранилище ваших идей и черновиков.", tags: ["заметки", "блокнот", "текст", "запиши", "напиши", "заметочка", "заметка", "метка", "меточка"] }, 
        { name: "Neuron Converter", url: "https://converter.neuron-p2p.ru", icon: "fa-exchange-alt", desc: "Быстрая конвертация любых величин и валют.", tags: ["конвертер", "валюта", "деньги", "перевод"] }, 
        { name: "Digital Studio", url: "studio.html", icon: "fa-palette", desc: "Создание интерфейсов и цифрового искусства.", tags: ["студия", "дизайн", "studio", "сайт", "домен"] }, 
        { name: "Neuron Tools", url: "https://tools.neuron-p2p.ru", icon: "fa-tools", desc: "Инструментарий для разработчиков и инженеров.", tags: ["тулс", "инструменты", "tools", "инструмент"] }, 
        { name: "Neuron Budget", url: "https://budget.neuron-p2p.ru", icon: "fa-wallet", desc: "Учет личных финансов в защищенном контуре.", tags: ["бюджет", "деньги", "кошелек", "траты", "операции", "операция", "аналитика"] }, 
        { name: "Neuron Study", url: "https://study.neuron-p2p.ru", icon: "fa-graduation-cap", desc: "Платформа для обучения и хранения знаний.", tags: ["учеба", "школа", "лекции", "учится", "дз", "домашнее задание", "school"] }, 
        { name: "Neuron Link", url: "https://link.neuron-p2p.ru", icon: "fa-shield-alt", desc: "Сервис для анонимизации и защиты внешних ссылок.", tags: ["линк", "ссылка", "безопасность", "тег"] }, 
        { name: "Neuron Calendar", url: "https://calendar.neuron-p2p.ru", icon: "fa-calendar-alt", desc: "Планировщик задач с синхронизацией узлов.", tags: ["календарь", "время", "планы", "план", "планировщик", "событие"] }, 
        { name: "Game Hub", url: "https://game-hub.neuron-p2p.ru", icon: "fa-gamepad", desc: "Игровой сегмент для отдыха внутри системы.", tags: ["игры", "гейм", "отдых", "игра", "пазл", "пазлы", "печать", "2048"] }, 
        { name: "Pass Generator", url: "https://password-generator.neuron-p2p.ru", icon: "fa-key", desc: "Создание паролей с максимальной энтропией.", tags: ["пароль", "безопасность", "ключ", "пароли", "пас", "пасс", "pass", "password"] }, 
        { name: "Neuron Synapse", url: "https://synapse.neuron-p2p.ru", icon: "fa-network-wired", desc: "Шифрованный протокол связи между пользователями.", tags: ["чат", "связь", "синапс", "аноним", "разговор", "писать"] }, 
        { name: "What If", url: "https://ifwhat.ru", icon: "fa-infinity", desc: "Анализ альтернативных сценариев и гипотез.", tags: ["что если", "история", "сценарии", "вдруг", "гипотеза", "сценарий", "альтернатива"] },
        { name: "Донат", url: "https://yoomoney.ru/to/4100119394883694", icon: "fa-heart", desc: "Поддержать проект.", tags: ["донат", "деньги", "donate", "пожертвование", "помощь", "помочь", "help"] }
    ];

    const ALL_NEWS = [
        { id: 2, date: "20.01.2026 | 21:15", text: "Исправлено отображение уведомлений. Теперь они всегда поверх иконок!" },
        { id: 1, date: "20.01.2026 | 12:00", text: "Запуск нового интерфейса Neural Mesh." }
    ];

    function init() {
        // Сетка
        const grid = document.getElementById('main-grid');
        grid.innerHTML = services.map((s, i) => `
            <a href="${s.url}" class="node-card" target="_blank" style="--i: ${i}">
                <div class="node-icon"><i class="fas ${s.icon}"></i></div>
                <h3 class="node-title">${s.name}</h3>
                <p class="node-desc">${s.desc}</p>
            </a>
        `).join('');

        // Новости
        const list = document.getElementById('news-list');
        const widget = document.getElementById('news-widget-list');
        const dot = document.getElementById('bell-dot');
        const lastId = localStorage.getItem('last_news_id') || 0;

        const html = ALL_NEWS.slice(0, 3).map(n => `
            <div class="news-item">
                <span class="news-date">${n.date}</span>
                <div class="news-text">${n.text}</div>
            </div>
        `).join('');
        
        const widgetHtml = ALL_NEWS.slice(0, 3).map(n => `
            <div class="news-widget-item">
                <div class="news-widget-date">${n.date}</div>
                <div class="news-widget-text">${n.text}</div>
            </div>
        `).join('');

        list.innerHTML = html;
        widget.innerHTML = widgetHtml;
        if (ALL_NEWS[0].id > lastId) dot.style.display = 'block';
    }

    function toggleNewsDropdown() {
        const d = document.getElementById('news-dropdown');
        d.classList.toggle('show');
        if (d.classList.contains('show')) {
            document.getElementById('bell-dot').style.display = 'none';
            localStorage.setItem('last_news_id', ALL_NEWS[0].id);
        }
    }

    function toggleSearch() {
        const m = document.getElementById('search-modal');
        m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }

    function toggleDonate() {
        const m = document.getElementById('donate-modal');
        m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }

    // Canvas фон
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();
    for(let i=0; i<60; i++) pts.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5});
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        pts.forEach((p,i)=>{
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0||p.x>canvas.width) p.vx*=-1; if(p.y<0||p.y>canvas.height) p.vy*=-1;
            ctx.fillStyle = 'rgba(255,140,0,0.3)'; ctx.beginPath(); ctx.arc(p.x,p.y,1,0,Math.PI*2); ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    draw();
    init();
</script>
</body>
</html>
